[project]
name = "collaborative-forcing"
version = "0.1.0"
description = "Portable, manifest-driven experiment runner for collaborative video generation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Zirui Lang" }]
dependencies = [
  "huggingface-hub>=2.0,<3; sys_platform == 'darwin' or python_version == '3.12'",
  "huggingface-hub==0.28.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "pysocks==1.7.1",
  "socksio>=1.0,<2",
  "wandb==0.19.11",
  "accelerate==1.1.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "av==13.1.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "diffusers==0.31.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "easydict==1.13; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "einops==0.8.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "fairscale==0.4.13; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "timm==0.9.16; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "ftfy==6.3.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "fastapi==0.116.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "imageio==2.36.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "imageio-ffmpeg==0.5.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "loguru==0.7.3; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "matplotlib==3.10.7; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "msgpack==1.1.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "numpy==1.24.4; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "omegaconf==2.3.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "opencv-python-headless==4.10.0.84; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "pandas==2.2.3; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "peft==0.14.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "pillow==10.4.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "pydantic==2.10.6; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "pyiqa==0.1.13; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "pyyaml==6.0.2; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "python-dotenv==1.1.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "python-multipart==0.0.20; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "regex==2024.11.6; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "requests==2.32.3; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "safetensors==0.5.2; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "scipy==1.14.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "sentencepiece==0.2.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "tokenizers==0.21.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "torch==2.5.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "torchvision==0.20.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "tqdm==4.67.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "transformers==4.49.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
]

[project.scripts]
cfexp = "cfexp.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfexp"]

[tool.uv]
package = true
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
  "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
]
exclude-dependencies = [
  "addict",
  "bitsandbytes",
  "facexlib",
  "future",
  "icecream",
  "lmdb",
  "openai-clip",
  "pre-commit",
  "pytest",
  "scikit-image",
  "tensorboard",
  "yapf",
]
override-dependencies = [
  "transformers==4.49.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
